# =============================================================================
#  R E P S   ·   bcgen-lang
# =============================================================================
[package]
name    = "bcgen-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Compiles HIR to LSB bytecode: the path from a forged language's meaning to code bvm-lang runs."

# Keywords (5 max)
keywords = ["bytecode", "compiler", "hir", "codegen", "lexersketch"]

# Categories
categories = ["compilers", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/bcgen-lang"
repository    = "https://github.com/jamesgober/bcgen-lang"
documentation = "https://docs.rs/bcgen-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bcgen_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Forwards `std` to the family crates. The compiler itself needs only `alloc`.
std = ["hir-lang/std", "bytecode-lang/std", "intern-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The input: HIR (spec v2) with its ids, origins, binders, and traversal.
hir-lang = { version = "0.3", default-features = false }
# The output: LSB modules, built with label-resolving function builders.
bytecode-lang = { version = "0.2", default-features = false }
# Symbol text (function, import, field, and local names) through the interner's
# read contract `Lookup`; the same major version hir-lang uses.
intern-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# Executes what the compiler emits: the differential, end-to-end, and load tests.
bvm-lang = "=2.0.0-alpha.1"
# End-to-end: resolve a hand-lowered unit before compiling it.
resolve-lang = "0.2"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
